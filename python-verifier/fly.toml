# Despliegue del verificador de documentos en Fly.io.
#
#   cd python-verifier
#   fly launch --no-deploy --copy-config
#   fly secrets set DOCVERIFY_TOKEN="$(openssl rand -hex 32)"
#   fly deploy
#   fly secrets list          # para ver que quedó puesto
#
# Después, en el BACKEND (Vercel):
#   DOCVERIFY_URL=https://<app>.fly.dev
#   DOCVERIFY_TOKEN=<el mismo valor que pusiste arriba>

app = "freewheel-docverify"
primary_region = "eze"          # Buenos Aires; cambialo si te queda lejos

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # El verificador solo lo llama el backend: no hace falta tenerlo despierto
  # todo el tiempo, pero el primer pedido después de dormir tarda.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  # OCR + OpenCV sobre una foto: con menos memoria que esto se muere en medio
  # del análisis y el pedido queda sin respuesta.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

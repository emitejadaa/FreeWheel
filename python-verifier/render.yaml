# Despliegue del verificador de documentos en Render, en un clic.
#
# En el panel de Render: New → Blueprint → apuntá al repo → elegí este archivo.
# Render construye el Dockerfile de esta carpeta y publica el servicio.
#
# DESPUÉS, en las variables del BACKEND (Vercel):
#   DOCVERIFY_URL=https://<lo-que-te-dio-render>     (sin barra final)
#   DOCVERIFY_TOKEN=<el mismo valor que se generó acá abajo>
# El token se genera solo la primera vez: se copia desde Render → Environment.
#
# ⚠️ El plan free se apaga solo cuando no se usa y el primer pedido después
# tarda ~1 minuto en despertar. Como Vercel corta sus funciones a los 60 s, con
# el plan free conviene DOCVERIFY_TIMEOUT_MS=50000 en el backend para que
# conteste "el verificador no contestó" en vez de morir sin explicación. Para
# que ande siempre rápido, el plan pago más chico alcanza.
services:
  - type: web
    name: freewheel-docverify
    runtime: docker
    plan: free
    rootDir: python-verifier
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render lo genera solo y queda guardado; hay que copiarlo al backend.
      - key: DOCVERIFY_TOKEN
        generateValue: true

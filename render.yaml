# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# Por ahora declara UN servicio: la API de verificación documental (Python).
# El backend Nest sigue en Vercel; si algún día se muda, se agrega acá abajo y
# los dos quedan descritos en el mismo archivo.
#
# Por qué esta API no puede ir en Vercel: entre opencv, numpy y onnxruntime son
# ~300 MB de wheels, más ~15 MB de modelos de OCR. El límite de una función
# serverless de Vercel es 250 MB descomprimidos, así que no entra — y aunque
# entrara, cada invocación volvería a cargar los modelos en memoria. Necesita
# un proceso que viva, y eso es lo que Render da.
services:
  - type: web
    name: freewheel-docverify
    runtime: docker
    # El Dockerfile y su contexto viven en la subcarpeta; las dos rutas van
    # desde la raíz del repo. Sin `dockerContext` el `COPY requirements.txt`
    # del Dockerfile no encontraría el archivo.
    dockerfilePath: ./docverify-api/Dockerfile
    dockerContext: ./docverify-api
    region: oregon
    # `free` se apaga tras 15 minutos sin tráfico y despertarlo tarda ~50 s:
    # el primer usuario que sube un documento después de un rato se come esa
    # espera. `starter` no se apaga.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Un push que solo toca el backend Nest no tiene por qué reconstruir una
    # imagen de 1 GB.
    buildFilter:
      paths:
        - docverify-api/**
        - render.yaml
    envVars:
      # Clave compartida con el backend. Render genera una al crear el
      # servicio; hay que copiarla a la variable DOCVERIFY_TOKEN de Vercel.
      - key: DOCVERIFY_TOKEN
        generateValue: true
      # Vacío = cualquier origen. Solo hace falta si un navegador llama a esta
      # API directo; el backend la llama server-side y no pasa por CORS.
      - key: DOCVERIFY_ORIGENES
        sync: false
      # 8 MB alcanza para cualquier foto de teléfono y acota lo que un
      # desconocido puede hacernos procesar.
      - key: DOCVERIFY_MAX_KB
        value: "8000"

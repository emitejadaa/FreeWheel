# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# Por ahora declara UN servicio: la API de verificación documental (Python).
# El backend Nest sigue en Vercel; si algún día se muda, se agrega acá abajo y
# los dos quedan descritos en el mismo archivo.
#
# Por qué esta API no puede ir en Vercel: entre opencv, numpy y onnxruntime son
# ~300 MB de wheels, más ~15 MB de modelos de OCR. El límite de una función
# serverless de Vercel es 250 MB descomprimidos, así que no entra — y aunque
# entrara, cada invocación volvería a cargar los modelos en memoria. Necesita
# un proceso que viva, y eso es lo que Render da.
services:
  - type: web
    name: freewheel-docverify
    runtime: docker
    # El Dockerfile y su contexto viven en la subcarpeta; las dos rutas van
    # desde la raíz del repo. Sin `dockerContext` el `COPY requirements.txt`
    # del Dockerfile no encontraría el archivo.
    dockerfilePath: ./docverify-api/Dockerfile
    dockerContext: ./docverify-api
    region: oregon
    # MEDIDO EN ESTE DEPLOY: en `free` un análisis NO TERMINA.
    #
    # Tres corridas, tres veces lo mismo: el proceso muere a los 2-3 minutos de
    # empezar a analizar, sin traceback y sin que /health deje de contestar 200.
    # Una de las muestras de memoria llegó a 510 MB contra el límite de 512, y
    # el resto del patrón —muerte silenciosa, a mitad de camino— es el de un
    # OOM. El pico está en la búsqueda de códigos de barras, que trabaja sobre
    # el encuadre canónico (1600x1009, un tamaño FIJO) y saca copias al doble y
    # al triple: por eso achicar la foto de entrada no lo bajó.
    #
    # Se deja en `free` igual, y no es resignación: la lectura automática es un
    # acelerador, no un requisito. Con el servicio muriendo, cada documento
    # queda en PENDING con su motivo y lo revisa un admin, que es exactamente
    # como funcionaba el sistema antes de que esto existiera. Nadie se queda sin
    # poder verificarse.
    #
    # PARA QUE LA LECTURA AUTOMÁTICA FUNCIONE DE VERDAD hace falta más memoria:
    # `standard` (2 GB) en Render, o un host gratuito con RAM de sobra —Hugging
    # Face Spaces da 16 GB, Oracle Always Free 24—. Está comparado en
    # docverify-api/README.md. Ojo: `starter` NO alcanza, tiene los mismos
    # 512 MB que `free` y solo cambia la CPU.
    #
    # Lo que además se paga en el plan gratuito son dos cosas:
    #
    #   · SE APAGA a los 15 minutos sin tráfico, y despertar esta imagen tarda
    #     ~50 segundos. Eso es MÁS de lo que el backend puede esperar (corre en
    #     una función serverless con tope de 60 s que además tiene que bajar las
    #     dos fotos), así que el primer análisis después de un rato SIEMPRE se
    #     cae. No es un problema: ese pedido es el que lo despierta, el
    #     documento queda igual de válido, y el front reintenta con
    #     `POST /verification/identity/:document/retry-analysis` — que ya
    #     encuentra el servicio andando. Si nadie reintenta, lo revisa un admin.
    #
    #   · 0,1 CPU contra los 0,5 de `starter`. El análisis tarda varias veces
    #     más. Tampoco bloquea a nadie: es asíncrono y el usuario ve
    #     "revisando tus documentos" mientras tanto; solo lo ve más tiempo.
    #
    # La memoria es la MISMA en los dos planes (512 MB), que es el recurso que
    # de verdad podría no alcanzar. O sea que si funciona en `free`, el
    # problema de `starter` era solo la velocidad.
    #
    # Para pasar a `starter` (US$ 7/mes): cambiar esta línea, o el plan desde el
    # dashboard. Conviene hacerlo cuando la espera del usuario empiece a
    # molestar, no antes.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Un push que solo toca el backend Nest no tiene por qué reconstruir una
    # imagen de 1 GB.
    buildFilter:
      paths:
        - docverify-api/**
        - render.yaml
    envVars:
      # Clave compartida con el backend. Render genera una al crear el
      # servicio; hay que copiarla a la variable DOCVERIFY_TOKEN de Vercel.
      - key: DOCVERIFY_TOKEN
        generateValue: true
      # Vacío = cualquier origen. Solo hace falta si un navegador llama a esta
      # API directo; el backend la llama server-side y no pasa por CORS.
      - key: DOCVERIFY_ORIGENES
        sync: false
      # 8 MB alcanza para cualquier foto de teléfono y acota lo que un
      # desconocido puede hacernos procesar.
      - key: DOCVERIFY_MAX_KB
        value: "8000"
      # Con 0,1 CPU un análisis tarda bastante, así que la fila se hace larga
      # antes de lo que uno espera. Cuatro pendientes ya son varios minutos de
      # espera para el último: mejor contestar "ahora no" que aceptar y tardar.
      - key: DOCVERIFY_COLA_MAXIMA
        value: "4"
      # Un solo hilo en las librerías numéricas.
      #
      # El plan gratuito da 0,15 de un núcleo: repartir ese pedacito entre
      # varios hilos no acelera nada —no hay paralelismo real que ganar— y cada
      # hilo de ONNX Runtime reserva su propia memoria de trabajo. En una
      # instancia de 512 MB eso es memoria que se paga sin recibir nada a
      # cambio. Con más CPU disponible, subirlo tiene sentido; acá no.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # Tope del lado más largo de la foto que entra al análisis. Ver
      # LADO_MAXIMO en encuadre.py: es lo que acota la memoria de todo el
      # pipeline, porque el tamaño de entrada se multiplica hacia abajo.
      - key: DOCVERIFY_LADO_MAXIMO
        value: "2000"

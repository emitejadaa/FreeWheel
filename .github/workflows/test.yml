name: tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freewheel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Disposable CI database — the suite truncates every table.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freewheel_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/freewheel_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      ALLOW_DB_RESET: "true"
      # Stripe runs in test mode; e2e uses the offline mock provider. The dummy
      # signing secret must match what the test helper signs webhooks with.
      PAYMENTS_PROVIDER: mock
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      DEFAULT_CURRENCY: usd
      PLATFORM_FEE_PCT: "0.10"
      INSURANCE_PCT: "0.10"
      SENA_PCT: "0.30"
      DEPOSIT_DEFAULT_USD: "200"
      STRIPE_CONNECT_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs `prisma generate` (postinstall); the global test setup runs
      # `prisma migrate deploy` against the service database before the suite.
      - run: npm ci

      - run: npm run build --if-present

      - run: npm test
